<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171a20">
  <title>Prompt Archive</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js?64"></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark">✦</div>
      <div>
        <div class="eyebrow">PROMPT LIBRARY</div>
        <div class="brand-title">PROMPT ARCHIVE</div>
      </div>
      <span class="edition" id="edition">COLLECTION</span>
    </header>
    <section id="loading" class="status">Cargando ficha…</section>
    <section id="error" class="status error hidden">No se encontró esta ficha. Comprueba el identificador de la publicación.</section>
    <article id="prompt-card" class="prompt-card hidden">
      <div class="hero-wrap"><img id="hero-image" class="hero-image" src="./assets/placeholder.svg" alt="Imagen de la ilustración"></div>
      <div class="intro">
        <div class="category-row" id="categories"></div>
        <h1 id="title">Título de la ilustración</h1>
        <p id="description" class="description"></p>
        <div class="meta-line" id="meta"></div>
      </div>
      <div id="sections" class="sections"></div>
      <footer class="footer"><span id="footer-label">PROMPT ARCHIVE</span><span id="author-label"></span></footer>
    </article>
  </main>
  <script src="./app.js"></script>
</body>
</html>
